name: mechanix-lockscreen
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Mufeed Ali <mufeeda@mechasystems.com>"
description: Lockscreen for Mechanix OS
homepage: https://github.com/mecha-org/mechanix-lockscreen.git
license: BSD

overrides:
  deb:
    depends:
      - libpam-pwdfile

contents:
  - src: ./target/aarch64-unknown-linux-gnu/release/mechanix-lockscreen
    dst: /usr/bin/mechanix-lockscreen
    file_info:
      mode: 0755
  - src: ./resources/pam.d/mechanix-lockscreen
    dst: /etc/pam.d/mechanix-lockscreen
    file_info:
      mode: 0644
  - src: ./resources/make-pin.sh
    dst: /usr/bin/mechanix-lockscreen-make-pin
    file_info:
      mode: 0755
  - src: ./resources/pin.passwd.sample
    dst: /etc/mechanix/pin.passwd
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: mecha
